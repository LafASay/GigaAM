name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
        matrix:
          python-version: ["3.13"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget ffmpeg libsndfile1 libasound2-dev
        ffmpeg -version

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Show disk usage before install
      run: df -h

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install --no-cache-dir -e .

    - name: Show disk usage after install
      run: df -h

    - name: Run model loading tests
      run: |
        pytest -v tests/test_loading.py -m partial --tb=short

    - name: Run audio loading tests
      run: |
        pytest -v tests/test_reading.py --tb=short

    - name: Run batching tests
      run: |
        pytest -v tests/test_batching.py --tb=short
    
    - name: Run longform tests
      run: |
        pytest -v tests/test_longform.py --tb=short

    - name: Run diarization tests
      run: |
        pytest -v tests/test_diarization.py --tb=short

    - name: Run onnx tests
      run: |
        pytest -v tests/test_onnx.py --tb=short

    - name: Run timestamps tests
      run: |
        pytest -v tests/test_timestamps.py --tb=short

    - name: Run normalization tests
      run: |
        pytest -v tests/test_normalize.py --tb=short

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        cache: 'pip'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install linters
      run: |
        pip install --upgrade pip
        pip install .
    
    - name: Check code formatting with black
      run: |
        black --check --diff gigaam/ tests/

    - name: Check imports with isort
      run: |
        isort --check-only --diff gigaam/ tests/

    - name: Lint with flake8
      run: |
        flake8 --ignore=E203,W503,W504 --max-line-length=120 --statistics gigaam/ tests/
    
    - name: Type check with mypy
      run: |
        mypy gigaam/ --ignore-missing-imports --no-strict-optional
